<!doctype html>
<html lang="ru" data-theme="dark" data-palette="bordo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
  <meta name="theme-color" content="#0f1115">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Factor — мессенджер с сообществами, каналами и музыкой.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Factor">
  <meta name="format-detection" content="telephone=no">

  <title>Factor</title>

  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="apple-touch-icon" href="/logo.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    /* FOUC guard — inline critical to hide until style.css loads */
    html,body{margin:0;padding:0;background:#0f1115;color:#e6e8ee}
    #boot{position:fixed;inset:0;display:grid;place-items:center;background:#0f1115;z-index:9999}
    #boot .logo{width:56px;height:56px;animation:pulse 1.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.5;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}
  </style>
</head>
<body>

<!-- ── SVG icon sprite (referenced as <use href="#i-...">) ── -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-chats" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
        d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7A2.5 2.5 0 0 1 17.5 16H10l-4.5 4v-4A2.5 2.5 0 0 1 3 13.5z"/>
    </symbol>
    <symbol id="i-communities" viewBox="0 0 24 24">
      <circle cx="9" cy="9" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="17" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
        d="M3.5 19c.7-3.2 2.9-5 5.5-5s4.8 1.8 5.5 5M15 19c.3-2 1.6-3.4 3.4-3.4 1.2 0 2.2.6 3 1.7"/>
    </symbol>
    <symbol id="i-music" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
        d="M9 18V6l10-2v12"/>
      <circle cx="6.5" cy="18" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="16.5" cy="16" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
    </symbol>
    <symbol id="i-saved" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"
        d="M6 4h12v17l-6-4-6 4z"/>
    </symbol>
    <symbol id="i-profile" viewBox="0 0 24 24">
      <circle cx="12" cy="8.5" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
        d="M4.5 20c.9-3.6 3.9-5.5 7.5-5.5s6.6 1.9 7.5 5.5"/>
    </symbol>
    <symbol id="i-settings" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
        d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
    </symbol>
    <symbol id="i-admin" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
        d="M12 3l8 3v5c0 4.5-3.2 8.5-8 10-4.8-1.5-8-5.5-8-10V6z"/>
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
        d="M9 12l2 2 4-4"/>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M20 20l-4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-back" viewBox="0 0 24 24">
      <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-send" viewBox="0 0 24 24">
      <path d="M4 12l16-8-6 16-3-6z" fill="currentColor"/>
    </symbol>
    <symbol id="i-close" viewBox="0 0 24 24">
      <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24">
      <circle cx="5" cy="12" r="1.8" fill="currentColor"/>
      <circle cx="12" cy="12" r="1.8" fill="currentColor"/>
      <circle cx="19" cy="12" r="1.8" fill="currentColor"/>
    </symbol>
    <symbol id="i-verified" viewBox="0 0 24 24">
      <path d="M12 2l2.4 2.1 3.1-.6.7 3.1 2.8 1.5-1.2 3 1.2 3-2.8 1.5-.7 3.1-3.1-.6L12 22l-2.4-2.1-3.1.6-.7-3.1L3 15.9l1.2-3L3 9.9l2.8-1.5.7-3.1 3.1.6z" fill="currentColor"/>
      <path d="M8.5 12l2.5 2.5 4.5-5" fill="none" stroke="#0f1115" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24">
      <path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>

<!-- ── Boot splash ── -->
<div id="boot">
  <img class="logo" src="/logo.svg" alt="Factor" width="56" height="56">
</div>

<!-- ── App shell ── -->
<div id="app" hidden>

  <header class="app-header" id="appHeader">
    <button class="icon-btn" id="headerBack" type="button" aria-label="Назад" hidden>
      <svg width="22" height="22"><use href="#i-back"/></svg>
    </button>
    <a href="#/chats" class="brand" aria-label="Factor — на главную">
      <img src="/logo.svg" alt="" width="28" height="28">
      <span class="brand-name">Factor</span>
    </a>
    <div class="header-title" id="headerTitle" hidden></div>
    <div class="header-actions">
      <button class="icon-btn" id="headerSearch" type="button" aria-label="Поиск">
        <svg width="22" height="22"><use href="#i-search"/></svg>
      </button>
      <button class="icon-btn" id="headerAdmin" type="button" aria-label="Админ-панель" hidden>
        <svg width="22" height="22"><use href="#i-admin"/></svg>
      </button>
    </div>
  </header>

  <main id="view" class="view" aria-live="polite" aria-busy="false">
    <noscript>
      <div class="empty-state">
        <h2>Нужен JavaScript</h2>
        <p>Factor — интерактивное приложение. Включите JavaScript в браузере.</p>
      </div>
    </noscript>
  </main>

  <nav class="bottom-nav" id="bottomNav" aria-label="Основная навигация">
    <a href="#/chats"      class="nav-item" data-nav="chats">
      <svg width="22" height="22"><use href="#i-chats"/></svg><span>Чаты</span>
    </a>
    <a href="#/communities" class="nav-item" data-nav="communities">
      <svg width="22" height="22"><use href="#i-communities"/></svg><span>Сообщества</span>
    </a>
    <a href="#/music"      class="nav-item" data-nav="music">
      <svg width="22" height="22"><use href="#i-music"/></svg><span>Музыка</span>
    </a>
    <a href="#/saved"      class="nav-item" data-nav="saved">
      <svg width="22" height="22"><use href="#i-saved"/></svg><span id="navSavedLabel">Избранное</span>
    </a>
    <a href="#/profile"    class="nav-item" data-nav="profile">
      <svg width="22" height="22"><use href="#i-profile"/></svg><span>Профиль</span>
    </a>
  </nav>

  <div class="player" id="player" hidden aria-label="Плеер">
    <img id="playerCover" class="player-cover" alt="" width="44" height="44">
    <div class="player-meta">
      <div class="player-title" id="playerTitle">—</div>
      <div class="player-artist" id="playerArtist">—</div>
    </div>
    <button class="icon-btn" id="playerToggle" type="button" aria-label="Играть/Пауза">
      <svg width="22" height="22" id="playerIcon"><use href="#i-play"/></svg>
    </button>
    <button class="icon-btn" id="playerClose" type="button" aria-label="Закрыть плеер">
      <svg width="18" height="18"><use href="#i-close"/></svg>
    </button>
    <audio id="audio" preload="metadata"></audio>
  </div>

</div>

<!-- ── Overlays ── -->
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>

<dialog id="modal" class="modal" aria-labelledby="modalTitle">
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="modalTitle" class="modal-title">Заголовок</h2>
      <button class="icon-btn" type="button" id="modalClose" aria-label="Закрыть">
        <svg width="20" height="20"><use href="#i-close"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot" hidden></div>
  </div>
</dialog>

<div id="sheetRoot" class="sheet-root" hidden></div>

<script type="module" src="/script.js"></script>
</body>
</html>
